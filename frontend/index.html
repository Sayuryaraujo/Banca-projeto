<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca de Jornal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2 id="logo">Banca de Jornal</h2>
    <input type="text" id="procurar" placeholder="Buscar produto...">
    <button onclick="abrirModal()">+Adicionar Produto</button>
</header>

<section id="produtos"></section>

<div id="cadastro" class="modal oculto">
    <div class="janela">
        <h2>Adicionar Produto</h2>

        <form id="formCard">
            <label>Nome</label>
            <input type="text" id="nome" required>

            <label>Categoria</label>
            <input type="text" id="categoria" required>

            <label>Preço</label>
            <input type="number" id="preco" required>

            <label>Imagem</label>
            <input type="text" id="imagem" required>

            <label>classificacao</label>
            <input type="text" id="classificacao" required>

            <br><br>

            <button type="button" onclick="fecharModal()">Cancelar</button>
            <button type="submit">Salvar</button>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
